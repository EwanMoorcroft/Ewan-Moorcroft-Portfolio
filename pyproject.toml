[project]
name = "ewan-data-portfolio"
version = "0.1.0"
description = "Quality tooling for a data science, machine learning, and geospatial portfolio"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
quality = [
  "pytest>=8.2,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
