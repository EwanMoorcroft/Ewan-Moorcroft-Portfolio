name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: repository
          python-version: "3.11"
      - run: uv sync --extra quality
      - run: uv run ruff check scripts tests
      - run: uv run ruff format --check scripts tests
      - run: uv run pytest tests
      - run: uv run python scripts/check_markdown_links.py .
      - run: uv run python scripts/audit_repository.py .

  project-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - tree-lidar-benchmark
          - liverpool-urban-accessibility
          - chest-xray-classification
          - fpl-forecasting
          - lunar-lander-double-dqn
          - neural-chunking
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.project }}
          python-version: "3.11"
      - run: uv sync --locked --extra test
        if: matrix.project == 'liverpool-urban-accessibility'
      - run: uv sync --extra test --extra train
        if: matrix.project == 'chest-xray-classification'
      - run: uv sync --extra test
        if: matrix.project != 'liverpool-urban-accessibility' && matrix.project != 'chest-xray-classification' && matrix.project != 'fpl-forecasting'
      - name: Install pinned FPL requirements
        if: matrix.project == 'fpl-forecasting'
        run: |
          uv venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          uv pip install --python .venv/bin/python --no-deps -e .
      - run: uv run pytest
        if: matrix.project != 'fpl-forecasting'
      - run: uv run --no-sync pytest
        if: matrix.project == 'fpl-forecasting'
      - run: uv run ruff check .
        if: matrix.project != 'fpl-forecasting'
      - run: uv run --no-sync ruff check .
        if: matrix.project == 'fpl-forecasting'
      - run: uv run ruff format --check .
        if: matrix.project != 'fpl-forecasting'
      - run: uv run --no-sync ruff format --check .
        if: matrix.project == 'fpl-forecasting'

  liverpool-r-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.3.3"
      - run: >-
          Rscript r/validate_results.R
          reports/retained
          /tmp/liverpool-r-validation.json
        working-directory: projects/liverpool-urban-accessibility

  liverpool-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t liverpool-access:ci .
        working-directory: projects/liverpool-urban-accessibility
      - run: docker run --rm liverpool-access:ci --help
      - run: >-
          docker run --rm liverpool-access:ci
          fixture --output-dir /tmp/fixture --size 5

  fpl-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build FPL image
        run: docker build -t fpl-forecast:ci .
        working-directory: projects/fpl-forecasting
      - name: Confirm non-root runtime
        run: docker run --rm --entrypoint sh fpl-forecast:ci -c 'test "$(id -u)" -ne 0'
      - name: Prepare writable synthetic workspace
        run: install -d -m 0777 /tmp/fpl-container-ci
      - name: Generate synthetic completed gameweeks
        run: >-
          docker run --rm
          -v /tmp/fpl-container-ci:/work
          fpl-forecast:ci synthetic
          --output-dir /work/gameweeks
          --season 2025-26
          --gameweeks 10
          --players 24
          --seed 42
      - name: Train season-bound artifact
        run: >-
          docker run --rm
          -v /tmp/fpl-container-ci:/work
          fpl-forecast:ci train
          --gameweek-dir /work/gameweeks
          --artifact /work/ridge.json
          --season 2025-26
      - name: Generate deterministic batch evidence
        run: >-
          docker run --rm
          -v /tmp/fpl-container-ci:/work
          fpl-forecast:ci predict
          --gameweek-dir /work/gameweeks
          --artifact /work/ridge.json
          --season 2025-26
          --expected-as-of-gw 10
          --completion-status completed
          --predictions /work/predictions.json
          --manifest /work/manifest.json
      - name: Verify and store batch
        run: >-
          docker run --rm
          -v /tmp/fpl-container-ci:/work
          fpl-forecast:ci store-batch
          --database /work/forecasts.duckdb
          --gameweek-dir /work/gameweeks
          --artifact /work/ridge.json
          --predictions /work/predictions.json
          --manifest /work/manifest.json
      - name: Start read-only service
        run: >-
          docker run --rm -d
          --name fpl-service-ci
          -p 127.0.0.1:18000:8000
          -v /tmp/fpl-container-ci:/work:ro
          --entrypoint fpl-forecast-service
          fpl-forecast:ci
          --artifact /work/ridge.json
          --gameweek-dir /work/gameweeks
          --database /work/forecasts.duckdb
          --season 2025-26
          --expected-as-of-gw 10
          --completion-status completed
          --host 0.0.0.0
          --port 8000
      - name: Check service health
        run: >-
          curl --fail --silent --show-error
          --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 --retry-max-time 45
          http://127.0.0.1:18000/health
      - name: Check service model metadata
        run: curl --fail --silent --show-error http://127.0.0.1:18000/model
      - name: Check in-memory prediction route
        run: >-
          curl --fail --silent --show-error
          -H 'Content-Type: application/json'
          --data '{"season_id":"2025-26","as_of_gw":10,"player_ids":[1,2]}'
          http://127.0.0.1:18000/predict
      - name: Check stored predictions route
        run: curl --fail --silent --show-error 'http://127.0.0.1:18000/predictions/2025-26/11?limit=2'
      - name: Check metrics route
        run: curl --fail --silent --show-error http://127.0.0.1:18000/metrics
      - name: Show service logs on failure
        if: failure()
        continue-on-error: true
        run: docker logs fpl-service-ci
      - name: Stop service
        if: always()
        continue-on-error: true
        run: docker rm -f fpl-service-ci
