name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: repository
          python-version: "3.11"
      - run: uv sync --extra quality
      - run: uv run ruff check scripts tests
      - run: uv run ruff format --check scripts tests
      - run: uv run pytest tests
      - run: uv run python scripts/check_markdown_links.py .
      - run: uv run python scripts/audit_repository.py .

  project-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - tree-lidar-benchmark
          - liverpool-urban-accessibility
          - chest-xray-classification
          - fpl-forecasting
          - lunar-lander-double-dqn
          - neural-chunking
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.project }}
          python-version: "3.11"
      - run: uv sync --locked --extra test
        if: matrix.project == 'liverpool-urban-accessibility'
      - run: uv sync --extra test
        if: matrix.project != 'liverpool-urban-accessibility'
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  liverpool-r-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - run: >-
          Rscript r/validate_results.R
          reports/retained
          /tmp/liverpool-r-validation.json
        working-directory: projects/liverpool-urban-accessibility

  liverpool-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t liverpool-access:ci .
        working-directory: projects/liverpool-urban-accessibility
      - run: docker run --rm liverpool-access:ci --help
      - run: >-
          docker run --rm liverpool-access:ci
          fixture --output-dir /tmp/fixture --size 5
