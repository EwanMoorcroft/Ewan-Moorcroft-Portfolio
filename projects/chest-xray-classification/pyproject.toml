[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chest-xray-benchmark"
version = "0.1.0"
description = "A reproducible three-class chest X-ray image benchmark with leakage-resistant splitting."
readme = "README.md"
license = "LicenseRef-Portfolio-Evaluation-Only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
train = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]
test = [
  "pytest>=8.2,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
cxr-benchmark = "chest_xray_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
