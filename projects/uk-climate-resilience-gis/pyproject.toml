[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-climate-resilience"
version = "1.0.0"
description = "Reproducible neighbourhood screening for climate-adaptation investigation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "geopandas>=1.0", "shapely>=2.0", "rasterio>=1.3", "pyproj>=3.6", "scipy>=1.12", "networkx>=3.2", "requests>=2.31", "matplotlib>=3.8", "pyarrow>=15"]

[project.scripts]
resilience = "resilience.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
