[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liverpool-urban-accessibility"
version = "1.0.0"
description = "Reproducible spatial analysis of Liverpool Census commuting flows."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Portfolio-Evaluation-Only"
license-files = ["LICENSE"]
dependencies = [
  "duckdb>=1.3,<2",
  "geopandas>=1.0,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyogrio>=0.10,<1",
  "pyproj>=3.7,<4",
  "shapely>=2.0,<3",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
test = [
  "pillow>=12,<13",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
liverpool-access = "liverpool_accessibility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/raw", "reports/generated"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]
